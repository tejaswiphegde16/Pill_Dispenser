<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispenser Analytics Hub</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --accent-blue: #58a6ff;
            --accent-green: #2ea44f;
            --accent-red: #da3633;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        header { text-align: center; padding: 10px 0; }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-muted); }
        .card { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .status-box { background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; text-align: center; }
        .status-box .label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
        .status-box .value { font-size: 1.5rem; font-weight: bold; }
        .status-box.missed .value { color: var(--accent-red); }
        .status-box.battery .value { color: var(--accent-blue); }
        .conn-badge { width: 100%; padding: 10px; text-align: center; font-size: 0.85rem; font-weight: 600; border-radius: 6px; background-color: rgba(218, 54, 51, 0.1); color: var(--accent-red); border: 1px solid rgba(218, 54, 51, 0.2); margin-bottom: 15px; }
        .conn-badge.connected { background-color: rgba(46, 164, 79, 0.1); color: var(--accent-green); border: 1px solid rgba(46, 164, 79, 0.2); }
        button { width: 100%; padding: 12px; background-color: #1f6feb; color: white; border: 1px solid rgba(240,246,2fc,0.1); border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background-color: #388bfd; }
        .config-group { display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        select, input[type="time"] { width: 100%; padding: 10px; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); }
        .timeline-inputs { display: flex; flex-direction: column; gap: 10px; }
        .slot-row { display: flex; flex-direction: column; gap: 5px; padding: 10px; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; }
        .slot-row span { font-size: 0.8rem; color: var(--text-muted); }
        .stream-box { max-height: 120px; overflow-y: auto; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.75rem; display: flex; flex-direction: column; gap: 4px; margin-bottom: 15px; }
        .log-entry { display: grid; grid-template-columns: 80px 1fr; border-bottom: 1px solid rgba(48, 54, 61, 0.3); }
        .log-ts { color: var(--text-muted); }
        .log-txt.success { color: var(--accent-green); }
        .log-txt.info { color: var(--accent-blue); }
        .log-txt.error { color: var(--accent-red); }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.85rem; }
        .history-table th { text-align: left; padding: 8px; background-color: var(--bg-primary); color: var(--text-muted); border: 1px solid var(--border-color); font-size: 0.75rem; }
        .history-table td { padding: 10px 8px; border: 1px solid var(--border-color); }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge.taken { background-color: rgba(46, 164, 79, 0.2); color: var(--accent-green); }
        .badge.missed { background-color: rgba(218, 54, 51, 0.2); color: var(--accent-red); }
        .badge.blocked { background-color: rgba(216, 153, 0, 0.2); color: #dbab09; }
        .btn-update { background-color: var(--accent-green); margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Dispenser Analytics Hub</h1>
        <p>Deterministic Tracking & Adherence Predictions</p>
    </header>

    <div class="card">
        <div id="connBadge" class="conn-badge">Disconnected</div>
        <div class="status-grid">
            <div class="status-box missed"><div class="label">Missed Doses</div><div id="missedVal" class="value">0</div></div>
            <div class="status-box battery"><div class="label">Battery Status</div><div id="batVal" class="value">--%</div></div>
        </div>
        <button id="connectBtn" onclick="requestBluetoothDevice()">Connect to Dispenser</button>
    </div>

    <div class="card config-group">
        <label for="freqSelect">Daily Dosage Frequency Profile</label>
        <select id="freqSelect" onchange="renderTimelineGrid()">
            <option value="1">1 Dose / Day</option>
            <option value="2" selected>2 Doses / Day</option>
            <option value="3">3 Doses / Day</option>
            <option value="4">4 Doses / Day</option>
            <option value="5">5 Doses / Day</option>
            <option value="6">6 Doses / Day</option>
        </select>
        <div id="timelineInputs" class="timeline-inputs"></div>
        <button class="btn-update" onclick="transmitScheduleConfiguration()">Update Schedule</button>
    </div>

    <div class="card">
        <label style="display:block; margin-bottom:10px;">Live Adherence Stream</label>
        <div id="streamBox" class="stream-box">
            <div class="log-entry"><span class="log-ts">[System]</span><span class="log-txt info">Awaiting connection matrix deployment...</span></div>
        </div>

        <label style="display:block; margin-bottom:10px;">Patient Intake History Log</label>
        <table class="history-table">
            <thead><tr><th>Timestamp</th><th>Scheduled Slot</th><th>Status Event</th></tr></thead>
            <tbody id="historyTableBody">
                <tr id="noRecordsRow"><td colspan="3" style="text-align: center; color: var(--text-muted); font-style: italic;">No ingestion events recorded yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    let bluetoothDevice = null;
    let txCharacteristic = null;
    let isExpectedDisconnect = false;

    function logger(text, type = "info") {
        const streamBox = document.getElementById("streamBox");
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.innerHTML = `<span class="log-ts">[${time}]</span><span class="log-txt ${type}">${text}</span>`;
        streamBox.appendChild(entry);
        streamBox.scrollTop = streamBox.scrollHeight;
    }

    function addHistoryRow(scheduledTime, statusText, badgeClass) {
        const tbody = document.getElementById("historyTableBody");
        const noRecordsRow = document.getElementById("noRecordsRow");
        if (noRecordsRow) noRecordsRow.remove();

        const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const dateString = new Date().toLocaleDateString([], { month: 'short', day: 'numeric' });
        
        const row = document.createElement("tr");
        row.innerHTML = `<td>${dateString}, ${timeString}</td><td style="font-weight:600; color:var(--accent-blue);">${scheduledTime}</td><td><span class="badge ${badgeClass}">${statusText}</span></td>`;
        tbody.insertBefore(row, tbody.firstChild);
    }

    function updateUI(connected) {
        const badge = document.getElementById("connBadge");
        const btn = document.getElementById("connectBtn");
        if (connected) {
            badge.innerText = "Connected"; badge.className = "conn-badge connected";
            btn.innerText = "Disconnect"; btn.style.backgroundColor = "#da3633";
        } else {
            badge.innerText = "Disconnected"; badge.className = "conn-badge";
            btn.innerText = "Connect to Dispenser"; btn.style.backgroundColor = "#1f6feb";
        }
    }

    function renderTimelineGrid() {
        const count = parseInt(document.getElementById("freqSelect").value);
        const container = document.getElementById("timelineInputs");
        container.innerHTML = "";
        const defaults = ["08:00", "20:00", "12:00", "16:00", "22:00", "06:00"];
        for (let i = 0; i < count; i++) {
            const row = document.createElement("div");
            row.className = "slot-row";
            row.innerHTML = `<span>DOSE SLOT #${i + 1}</span><input type="time" class="time-input" value="${defaults[i] || "12:00"}">`;
            container.appendChild(row);
        }
    }

    async function requestBluetoothDevice() {
        try {
            isExpectedDisconnect = false;
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                isExpectedDisconnect = true;
                bluetoothDevice.gatt.disconnect();
                return;
            }
            logger("Invoking global Bluetooth driver stack query...", "info");
            bluetoothDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SERVICE_UUID] });
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            await txCharacteristic.startNotifications();
            txCharacteristic.addEventListener('characteristicvaluechanged', handleInboundTelemetry);

            logger("Telemetry connection holding secure.", "success");
            updateUI(true);
            syncLocalTimeMatrix();
        } catch (error) {
            logger(`GATT Link rejected: ${error.message}`, "error");
            updateUI(false);
            bluetoothDevice = null;
        }
    }

    function onDisconnected() {
        updateUI(false); txCharacteristic = null; bluetoothDevice = null;
        if (!isExpectedDisconnect) {
            logger("Loss of signal encountered. Retrying...", "error");
            setTimeout(requestBluetoothDevice, 5000);
        }
    }

    function syncLocalTimeMatrix() {
        if (!txCharacteristic) return;
        const now = new Date();
        const payload = `TIME:${now.getHours()}:${now.getMinutes()}`;
        txCharacteristic.writeValue(new TextEncoder().encode(payload))
            .then(() => logger(`Clock synced: ${now.getHours()}:${now.getMinutes()}`, "info"));
    }

    function transmitScheduleConfiguration() {
        if (!txCharacteristic) { alert("Offline."); return; }
        const freq = document.getElementById("freqSelect").value;
        const inputs = document.querySelectorAll(".time-input");
        let payload = `FREQ=${freq}`;
        inputs.forEach((input, index) => { payload += `|T${index + 1}=${input.value}`; });
        txCharacteristic.writeValue(new TextEncoder().encode(payload))
            .then(() => logger(`Sent schedule: ${payload}`, "info"));
    }

    function handleInboundTelemetry(event) {
        const rawString = new TextDecoder().decode(event.target.value);
        logger(`Raw Inbound Frame: ${rawString}`, "success");

        try {
            const data = JSON.parse(rawString);
            if (data.missed !== undefined) document.getElementById("missedVal").innerText = data.missed;
            if (data.bat !== undefined) document.getElementById("batVal").innerText = data.bat + "%";
            
            if (data.status && data.status !== "SYNCED" && data.status !== "CONFIG_SYNC") {
                const activeInputs = document.querySelectorAll(".time-input");
                let matchedSlot = "08:00";
                
                if (activeInputs.length > 1) {
                    matchedSlot = activeInputs[1].value; 
                } else if (activeInputs.length > 0) {
                    matchedSlot = activeInputs[0].value;
                }
                
                if (data.status === "TAKEN") {
                    addHistoryRow(matchedSlot, "DOSE TAKEN", "taken");
                } else if (data.status === "MISSED") {
                    addHistoryRow(matchedSlot, "DOSE MISSED", "missed");
                } else if (data.status === "BLOCKED") {
                    addHistoryRow(matchedSlot, "PATH BLOCKED", "blocked");
                }
            }
        } catch (e) {
            logger("JSON parsing error.", "error");
        }
    }

    renderTimelineGrid();
</script>
</body>
</html>
